name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ios-retro-gunner/package-lock.json'
    
    - name: Install dependencies
      working-directory: ios-retro-gunner
      run: npm install --legacy-peer-deps
    
    - name: Build web app
      working-directory: ios-retro-gunner
      run: npm run build
    
    - name: Add iOS platform
      working-directory: ios-retro-gunner
      run: npx cap add ios || echo "iOS platform may already exist"
    
    - name: Sync Capacitor
      working-directory: ios-retro-gunner
      run: npx cap sync ios
    
    - name: Install CocoaPods dependencies
      working-directory: ios-retro-gunner/ios/App
      run: pod install
    
    - name: Build iOS app
      working-directory: ios-retro-gunner/ios/App
      run: |
        xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $PWD/build/App.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Export IPA
      working-directory: ios-retro-gunner/ios/App
      run: |
        # Create export options plist for ad-hoc distribution
        cat > ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        # Export the archive to IPA
        xcodebuild \
          -exportArchive \
          -archivePath $PWD/build/App.xcarchive \
          -exportPath $PWD/build \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
        
        # Rename the IPA file
        mv build/*.ipa build/RetroGunner-unsigned.ipa || \
        cp -r build/App.xcarchive/Products/Applications/App.app build/Payload && \
        cd build && zip -r RetroGunner-unsigned.ipa Payload
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v3
      with:
        name: RetroGunner-iOS-unsigned
        path: ios-retro-gunner/ios/App/build/RetroGunner-unsigned.ipa
        retention-days: 30
    
    - name: Create release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: RetroGunner Build ${{ github.run_number }}
        body: |
          Automated build of RetroGunner iOS app
          
          **Download:** RetroGunner-unsigned.ipa
          
          This is an unsigned IPA. You'll need to sign it before installing on your device.
          
          To sign the IPA, use a tool like iOS App Signer or Xcode.
        files: ios-retro-gunner/ios/App/build/RetroGunner-unsigned.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}